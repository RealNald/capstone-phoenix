---
- name: Ensure fail2ban is installed
  apt:
    name: fail2ban
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure fail2ban is running
  service:
    name: fail2ban
    state: started
    enabled: true
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Set UFW default policy to deny incoming
  ufw:
    policy: deny
    direction: incoming
  when: ansible_facts['os_family'] == "Debian"

- name: Set UFW default policy to allow outgoing
  ufw:
    policy: allow
    direction: outgoing
  when: ansible_facts['os_family'] == "Debian"

- name: Allow SSH (port 22) – CRITICAL to do BEFORE enabling
  ufw:
    rule: allow
    port: '22'
    proto: tcp
  when: ansible_facts['os_family'] == "Debian"

- name: Allow HTTP (port 80) for Ingress
  ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: ansible_facts['os_family'] == "Debian"

- name: Allow HTTPS (port 443) for Ingress
  ufw:
    rule: allow
    port: '443'
    proto: tcp
  when: ansible_facts['os_family'] == "Debian"

- name: Enable UFW – now safe because SSH is allowed
  ufw:
    state: enabled
  when: ansible_facts['os_family'] == "Debian"

- name: Harden SSH – disable root login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: restart sshd

- name: Harden SSH – disable password authentication (key-only)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present
  notify: restart sshd
