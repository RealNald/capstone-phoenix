---
- name: Get control plane private IP
  set_fact:
    server_private_ip: "{{ hostvars[groups['control_plane'][0]]['ansible_default_ipv4']['address'] }}"

- name: Get token from control plane
  set_fact:
    server_token: "{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}"

- name: Join worker node to cluster
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL=https://{{ server_private_ip }}:6443 K3S_TOKEN={{ server_token }} sh -
  args:
    creates: /usr/local/bin/kubectl
  register: join_result

- name: Verify worker joined successfully
  shell: kubectl get nodes -o wide | grep {{ ansible_default_ipv4.address }}
  register: verify_nodes
  until: verify_nodes.rc == 0
  retries: 10
  delay: 5
  delegate_to: "{{ groups['control_plane'][0] }}"
